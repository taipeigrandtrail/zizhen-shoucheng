<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d161e">
  <title>字陣守城｜文字方塊版面編輯器</title>
  <link rel="stylesheet" href="text-box-layout-editor.css">
</head>
<body>
  <main class="tb-editor">
    <header class="tb-header">
      <p>字陣守城</p>
      <h1>文字方塊版面編輯器</h1>
    </header>

    <section class="tb-tools" aria-label="工具列">
      <button type="button" id="add-block" class="primary">新增文字方塊</button>
      <button type="button" id="remove-block">刪除選取</button>
      <button type="button" id="clear-blocks">全部清除</button>
      <button type="button" id="copy-json">複製 JSON</button>
      <button type="button" id="download-json">下載 JSON</button>
      <label class="file-btn">
        匯入背景
        <input id="bg-input" type="file" accept="image/*">
      </label>
    </section>

    <div class="tb-layout">
      <section class="canvas-wrap" aria-label="文字區塊編輯區">
        <div id="canvas" class="canvas" role="application" aria-label="文字區塊畫布">
          <div id="bg-layer" class="canvas-bg" aria-hidden="true"></div>
          <div id="viewport" class="viewport" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="inspector" aria-label="屬性面板">
        <p class="inspector-title">選取區塊後可精修</p>
        <div class="row">
          <label for="field-name">名稱</label>
          <input id="field-name" type="text" placeholder="例如：標題欄">
        </div>
        <div class="row">
          <label for="field-text">文字</label>
          <input id="field-text" type="text" placeholder="顯示文字">
        </div>
        <div class="row split">
          <label for="field-x">X（%）</label>
          <label for="field-y">Y（%）</label>
        </div>
        <div class="row split">
          <input id="field-x" type="number" min="0" max="100" step="0.1">
          <input id="field-y" type="number" min="0" max="100" step="0.1">
        </div>
        <div class="row split">
          <label for="field-w">W（%）</label>
          <label for="field-h">H（%）</label>
        </div>
        <div class="row split">
          <input id="field-w" type="number" min="1" max="100" step="0.1">
          <input id="field-h" type="number" min="1" max="100" step="0.1">
        </div>
        <p id="selected-status" class="status">未選取</p>
      </aside>
    </div>

    <details open>
      <summary>輸出 JSON</summary>
      <textarea id="output-json" spellcheck="false" readonly aria-label="輸出結果"></textarea>
    </details>

    <details>
      <summary>從 JSON 匯入</summary>
      <p class="import-hint">貼上與「輸出 JSON」格式一致的資料，按「匯入 JSON」。</p>
      <textarea id="import-json" spellcheck="false" placeholder='{"version":"1.0","canvasWidth":390,"canvasHeight":844,"blocks":[...]}'></textarea>
      <div class="actions">
        <button type="button" id="import-json-btn" class="primary">匯入 JSON</button>
      </div>
    </details>

    <p id="tb-message" class="message" aria-live="polite"></p>
  </main>

  <script src="text-box-layout-editor.js"></script>
</body>
</html>
